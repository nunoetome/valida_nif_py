[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valida-nif"
version = "1.2.0"
description = "Valida NIF portugues (mod11) e NIF espanhol — DNI/NIE/CIF (mod23/CIF)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "nunoetome"}]
keywords = ["nif", "dni", "nie", "cif", "valida-nif", "portugal", "espanha"]

[project.scripts]
valida-nif = "valida_nif:main"
valida_nif = "valida_nif:main"
valida-nif-es = "valida_nif_es:main"
valida_nif_es = "valida_nif_es:main"

[tool.setuptools]
py-modules = ["valida_nif", "valida_nif_es"]

[tool.setuptools.package-dir]
"" = "src"
