[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valida_nif_py"
version = "1.1.0"
description = "Valida a estrutura de NIF portugues"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "nunoetome"}]

[tool.setuptools.packages.find]
where = ["src"]
